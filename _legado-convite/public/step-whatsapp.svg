<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360">
  <rect width="480" height="360" rx="24" fill="#1A1030"/>
  <circle cx="80" cy="60" r="110" fill="#3B1A6E" opacity="0.55"/>
  <circle cx="420" cy="320" r="120" fill="#F97316" opacity="0.12"/>
  <!-- smartphone -->
  <g transform="rotate(5 240 190)">
    <rect x="165" y="55" width="150" height="285" rx="24" fill="#0F172A" stroke="#3B1A6E" stroke-width="3"/>
    <rect x="175" y="73" width="130" height="249" rx="14" fill="#ECE5DD"/>
    <rect x="215" y="61" width="60" height="7" rx="3.5" fill="#3B1A6E"/>
    <!-- chat header -->
    <rect x="175" y="73" width="130" height="30" rx="14" fill="#128C7E"/>
    <rect x="175" y="89" width="130" height="14" fill="#128C7E"/>
    <circle cx="192" cy="88" r="8" fill="#FFFFFF"/>
    <rect x="206" y="82" width="52" height="6" rx="3" fill="#FFFFFF" opacity="0.9"/>
    <rect x="206" y="91" width="34" height="5" rx="2.5" fill="#FFFFFF" opacity="0.6"/>
    <!-- incoming bubble -->
    <rect x="183" y="116" width="96" height="34" rx="8" fill="#FFFFFF"/>
    <rect x="191" y="124" width="76" height="6" rx="3" fill="#CBD5E1"/>
    <rect x="191" y="134" width="52" height="6" rx="3" fill="#CBD5E1"/>
    <!-- confirmation bubble -->
    <rect x="183" y="160" width="110" height="42" rx="8" fill="#DCF8C6"/>
    <circle cx="197" cy="181" r="9" fill="#16A34A"/>
    <path d="M 192.5 181 l 3 3 l 6 -6.5" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="212" y="186" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="11" fill="#0F172A">Convite</text>
    <text x="212" y="196" font-family="Inter, Arial, sans-serif" font-weight="600" font-size="11" fill="#0F172A">confirmado!</text>
    <!-- outgoing bubble -->
    <rect x="213" y="212" width="84" height="30" rx="8" fill="#DCF8C6"/>
    <rect x="221" y="220" width="64" height="6" rx="3" fill="#94A3B8"/>
    <rect x="221" y="230" width="40" height="6" rx="3" fill="#94A3B8"/>
    <path d="M 285 236 l 3 3 l 5 -6 M 289 236 l 3 3 l 5 -6" stroke="#34B7F1" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- input bar -->
    <rect x="183" y="292" width="114" height="20" rx="10" fill="#FFFFFF"/>
    <circle cx="289" cy="302" r="12" fill="#128C7E"/>
    <path d="M 284 302 l 10 -4 l -4 4 l 4 4 Z" fill="#fff"/>
  </g>
  <g fill="#FDBA74">
    <circle cx="110" cy="110" r="4"/>
    <circle cx="92" cy="170" r="3"/>
  </g>
  <g fill="#93C5FD" opacity="0.8">
    <circle cx="386" cy="86" r="4"/>
    <circle cx="404" cy="140" r="3"/>
  </g>
</svg>
